name: Refresh from canonical generator

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'generator-refresh-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Download canonical generator
        run: |
          mkdir -p /tmp/quality-tool-generator
          base="https://raw.githubusercontent.com/lukasa1993/crap4rust/main/tools"
          curl --fail --location --retry 3 "$base/quality_tool_generator_logical_fix.py" -o /tmp/quality-tool-generator/quality_tool_generator.py
          curl --fail --location --retry 3 "$base/_quality_tool_generator_data_1.py" -o /tmp/quality-tool-generator/_quality_tool_generator_data_1.py
          curl --fail --location --retry 3 "$base/_quality_tool_generator_data_2.py" -o /tmp/quality-tool-generator/_quality_tool_generator_data_2.py
          curl --fail --location --retry 3 "$base/_quality_tool_generator_data_3.py" -o /tmp/quality-tool-generator/_quality_tool_generator_data_3.py
      - name: Generate current repository
        run: |
          python /tmp/quality-tool-generator/quality_tool_generator.py --repo "${GITHUB_REPOSITORY#*/}" --output .
          rm -f .github/workflows/refresh-generator.yml
      - name: Build and test exact generated tree
        run: |
          rm -rf build dist
          python -m pip install --upgrade pip build
          python -m build
          python -m pip install --force-reinstall dist/*.whl pytest
          python -m pytest -q
          "${GITHUB_REPOSITORY#*/}" --version
          "${GITHUB_REPOSITORY#*/}" --help
          python -m pip check
      - name: Commit verified generated tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Repository already matches the canonical generator."
          else
            git commit -m "Refresh from canonical production generator"
            git push origin HEAD:${{ github.head_ref }}
          fi
